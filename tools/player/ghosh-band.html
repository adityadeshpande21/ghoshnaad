<style>
/* Layout: sticky transport; below it each चरण is a set of "systems" (rows of गण blocks) with one row per part,

:root{
  --bg:#f4f2ec; --surface:#ffffff; --raise:#f8f6f1; --fg:#1d1f2b; --muted:#6a6d7c; --line:#e2ded4;
  --accent:#b8560f; --accent-soft:#f6e5d6; --ink:#27306b; --ink-soft:#e4e6f4; --leaf:#2f6b4f; --leaf-soft:#dcefe5;
  --brass:#8a6a12; --brass-soft:#f3ead0; --chip:#ecebe6; --now:#ffe2b8; --now-fg:#7a3a00;
  --display:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  /* row heights (shared by labels and every गण block) */
  --hb:18px; --hm:46px; --ha:42px; --hp:28px; --hj:0px; --ht:0px; --hs:30px;
  --sepw:9px; --barw:12px; --fm:1.2rem; --fa:1.08rem; --ft:.95rem; --cw:30px; --lw:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151c; --surface:#1c1e28; --raise:#222431; --fg:#ebe9e4; --muted:#9a9cab; --line:#2f3142;
  --accent:#f0954a; --accent-soft:#3a2716; --ink:#aab4ff; --ink-soft:#272b45; --leaf:#7fcca4; --leaf-soft:#1c3328;
  --brass:#e2c169; --brass-soft:#352c14; --chip:#262836; --now:#4d3410; --now-fg:#ffd7a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14151c; --surface:#1c1e28; --raise:#222431; --fg:#ebe9e4; --muted:#9a9cab; --line:#2f3142;
  --accent:#f0954a; --accent-soft:#3a2716; --ink:#aab4ff; --ink-soft:#272b45; --leaf:#7fcca4; --leaf-soft:#1c3328;
  --brass:#e2c169; --brass-soft:#352c14; --chip:#262836; --now:#4d3410; --now-fg:#ffd7a6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;gap:8px;padding-block:10px}
.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.ttl{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--ink);line-height:1.1}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.74rem;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.raga{background:var(--leaf-soft);color:var(--leaf)}
select{padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);max-width:100%}
#piece{max-width:min(240px,100%)}
.play{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:20px;height:20px;fill:currentColor}
.pos{display:grid;line-height:1.15;min-width:0;flex:1}
.pos b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.pos span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl{display:flex;align-items:center;gap:6px;min-width:150px;flex:1;max-width:320px}
.sl input{flex:1;min-width:0;accent-color:var(--accent)}
.sl span{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.sl{flex-basis:100%;max-width:none}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.set{position:relative;margin-left:auto}
.set summary{list-style:none;cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:10px;font-size:.86rem;color:var(--muted)}
.set summary::-webkit-details-marker{display:none}
.set[open] summary{color:var(--fg);border-color:var(--fg)}
.panel{position:absolute;right:0;top:calc(100% + 6px);width:min(330px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:40}
.tog{display:flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer}
.tog input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.tog select{margin-left:auto}
.hint{font-size:.76rem;color:var(--muted);margin:-6px 0 0 25px}

/* ---------- score ---------- */
main .wrap{padding-block:14px 70px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.score{display:grid;gap:14px;min-width:0}
.score[data-focus="mel"]{--hm:64px;--fm:1.6rem;--ha:30px;--fa:.88rem;--hp:22px;--hs:24px;--cw:40px}
.score[data-focus="anak"]{--ha:60px;--fa:1.45rem;--hm:30px;--fm:.92rem;--hp:22px;--hs:24px;--cw:40px}
.score[data-focus="tal"]{--hp:42px;--ft:1.3rem;--hm:30px;--fm:.92rem;--ha:28px;--fa:.86rem;--hs:26px}
.score[data-focus="tal"].tvx{--hj:36px;--ht:36px}
.score.tvx{--hj:24px;--ht:24px}
.score[data-focus="step"]{--hs:50px;--hm:30px;--fm:.92rem;--ha:28px;--fa:.86rem;--hp:22px}
.score.no-mel{--hm:0px}
.score.no-anak{--ha:0px}
.score.no-step{--hs:0px}
.ch{min-width:0}
.ch h3{margin:0 0 0 2px;font-size:.84rem;font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ch h3 b{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--fg)}
.ch h3 .rep{color:var(--accent);font-weight:700}
.tseg{display:grid;justify-content:start;min-width:0;overflow-x:auto;scrollbar-width:thin;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding-block:12px 14px}
.tseg>.ch{grid-column:1/-1;display:grid;grid-template-columns:subgrid;row-gap:8px}
.tseg .sys.cstart{margin-top:16px}
.seghead{grid-column:1/-1;display:flex;justify-content:flex-end;padding-right:14px;font-family:var(--display);color:var(--fg)}
.lb.mark{font-family:var(--display);font-size:.78rem;color:var(--fg);align-items:flex-end;overflow:visible}
.bar.inl{justify-self:start;width:var(--barw)}
.ch>h3{grid-column:1/-1}
.sys{grid-column:1/-1;display:grid;grid-template-columns:subgrid;grid-template-rows:var(--hb) var(--hm) var(--ha) var(--hp) var(--hj) var(--ht) var(--hs)}
.labels{display:contents}
.labels>*{grid-column:1}
.pk{background:var(--raise)}
.lb{border:0;background:none;padding:0 6px 0 0;margin:0;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden;min-height:0;font-size:.74rem;color:var(--muted);text-align:right;cursor:pointer;white-space:nowrap;line-height:1}
.lb.dv{font-family:var(--display);font-size:.9rem;color:var(--fg)}
.lb.off{opacity:.4}
.lb .chev{border:1px solid var(--line);background:var(--raise);border-radius:5px;font-size:.62rem;padding:1px 3px;cursor:pointer;line-height:1;color:var(--muted)}
.lb.l-mel{color:var(--ink)} .lb.l-anak{color:var(--accent)} .lb.l-tv{color:var(--brass)} .lb.l-step{color:var(--leaf)}
.gan{display:grid;grid-template-rows:var(--hb) var(--hm) var(--ha) var(--hp) var(--hj) var(--ht) var(--hs);flex:none}
.cell{overflow:hidden;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:0 4px;cursor:pointer;position:relative}
.r-beat{font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums;align-items:flex-end}
.r-beat.sam{color:var(--accent);font-weight:700}
.r-mel{font-family:var(--display);font-size:var(--fm);color:var(--ink);flex-direction:column;line-height:1.05;padding-bottom:7px}
.r-anak{font-family:var(--display);font-size:var(--fa);color:var(--accent);border-top:1px solid var(--line);padding-bottom:7px}
.r-tv{font-family:var(--display);font-size:var(--ft);color:var(--brass);background:repeating-linear-gradient(90deg,transparent 0 3px,var(--brass-soft) 3px 4px) top/100% 1px no-repeat}
.r-panav{border-top:1px dashed var(--line)}
.tv{opacity:.75}.tv.s{opacity:1;font-weight:700}
.r-step{padding:3px 2px;border-top:1px dashed var(--line)}
.foot{width:100%;height:100%;border-radius:999px;display:flex;align-items:center;padding-left:8px;font-size:.72rem;font-weight:700;letter-spacing:.04em;transition:transform .12s}
.foot.L{background:var(--leaf);color:var(--surface)}
.foot.R{border:1.5px solid var(--leaf);color:var(--leaf)}
.r-step.on .foot{transform:scaleY(1.18);box-shadow:0 0 0 3px var(--leaf-soft)}
.yati{font-family:var(--body);font-size:.8rem;color:var(--muted);font-style:italic;background:var(--raise);border-radius:8px;margin:4px 0}
.yt{font-family:var(--body);font-size:.66rem;color:var(--muted);font-style:italic}
.empty{color:var(--line)}
.sep{display:grid;grid-template-rows:var(--hm) var(--ha);pointer-events:none;color:var(--muted);font-family:var(--display);text-align:center;overflow:hidden}
.sep b{display:flex;align-items:center;justify-content:center;font-weight:400;min-height:0;overflow:hidden}
.bar{position:relative;pointer-events:none;background:linear-gradient(var(--fg),var(--fg)) 50% 0/1.5px 100% no-repeat;opacity:.85}
.bar.d{background:linear-gradient(var(--fg),var(--fg)) calc(50% - 1.5px) 0/1.5px 100% no-repeat,linear-gradient(var(--fg),var(--fg)) calc(50% + 2.5px) 0/3px 100% no-repeat}
.bar.rep::before{content:"";position:absolute;left:0;top:calc(var(--hb) + var(--hm) / 2 - 7px);width:3px;height:3px;border-radius:50%;background:var(--fg);box-shadow:0 10px 0 var(--fg)}
.endb{border-top:1.5px solid var(--fg)}
.ends{border-left:1.5px solid var(--fg)}
.enl{position:absolute;left:2px;top:0;font-size:.6rem;font-weight:700;color:var(--fg)}
.cell.now{background:var(--now)}
.cell.now.r-mel,.cell.now.r-anak{color:var(--now-fg)}
/* notation glyphs */
.sl8{display:inline-flex;gap:1px;position:relative}
.sl8.grp::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-4px;height:4px;border:1.3px solid currentColor;border-top:0;opacity:.55}
.s{position:relative;padding:0 1px}
.s.dot-b::after,.s.dot-t::before{content:"";position:absolute;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor}
.s.dot-b::after{bottom:-2px}.s.dot-t::before{top:-1px}
.s.vk{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.s .acc{position:absolute;top:-8px;left:0;right:0;text-align:center;font-size:.6rem;font-family:var(--body)}
.s .gr{font-size:.6em;vertical-align:super;opacity:.8}
.s.sls,.s.slm,.s.sle{border-top:1.3px solid currentColor}
.s.sls{border-top-left-radius:8px}.s.sle{border-top-right-radius:8px}
.cue{font-style:italic;font-size:.85em}
.ly{font-family:var(--body);font-size:.6rem;color:var(--leaf);margin-top:1px}

.legend{font-size:.84rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.legend p{margin:0}
.legend .lh{font-family:var(--display);font-size:1.02rem;color:var(--fg);margin-top:4px}
.legend b{color:var(--fg);font-weight:700;font-family:var(--display);font-size:1.08em}
.media a{color:var(--accent);font-weight:500;text-decoration:none}
.count{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:70;font-family:var(--display);font-size:4.5rem;color:var(--accent);background:var(--surface);border:2px solid var(--accent);border-radius:24px;padding:4px 34px;box-shadow:0 12px 40px rgba(0,0,0,.2);pointer-events:none}
@media (max-width:560px){:root{--sepw:5px;--barw:9px;--lw:40px;--fm:1.05rem;--fa:.98rem;--cw:21px}.lb.dv{font-size:.74rem}.lb{font-size:.6rem;padding-right:3px}
  .tseg{border-radius:12px}.cell{padding-left:1px;padding-right:1px}.foot{padding-left:5px;font-size:.62rem}
  .score{--hm:42px;--ha:38px}.lb .chev{padding:0 2px}}
@media (prefers-reduced-motion:reduce){.foot{transition:none}}
.printhead .bh{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:12px;font-family:var(--display);font-size:1.15rem}
.printhead .bh span:last-child{text-align:right}
.printhead h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--fg)}
.printhead h2 small{font-family:var(--body);font-size:.85rem;color:var(--muted)}
.printhead p{margin:2px 0 0;font-size:.82rem;color:var(--muted);text-align:center}
.printhead .verse p{font-family:var(--display);font-size:.95rem;color:var(--fg);margin:1px 0}
.printhead b{color:var(--fg)}
.legend .usage{font-family:var(--display);font-size:.95rem;color:var(--fg);text-align:center;margin-bottom:4px}
@media print{
  @page{size:A4 landscape;margin:10mm}
  .top,.count,.useit,.media,.lb .chev{display:none!important}
  #printhead{display:block!important;margin-bottom:6px}
  html,body{background:#fff!important} body::before{display:none}
  .score{--hm:36px;--ha:32px;--hp:21px;--hb:16px}.score.tvx{--hj:20px;--ht:20px}
  main .wrap{padding:0;max-width:none;gap:8px}
  .score{gap:8px}
  .tseg{border-color:#cfcabe;padding-block:8px}
  .sys{break-inside:avoid}
  .sys{break-inside:avoid}
  .tseg{overflow:visible}
  .legend{border-color:#cfcabe;font-size:.7rem;padding:6px 10px;gap:3px}
  .r-tv{background:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

      charan: c.n, pass: ctx.pass, tala: c.tala, ...(m.cue ? { cue: m.cue } : {}), ...(m.lyric ? { lyric: m.lyric } : {}), ...(m.step ? { step: m.step.foot } : {}) });
    if (m.cue) { last = null; t += dur; return; }
    const w = m.slots.map(s => s.w || 1), W = w.reduce((a, x) => a + x, 0) || 1;
    m.slots.forEach((s, k) => {
      const sd = dur * w[k] / W;
      if (s.type === 'hold') { if (last) last.dur += sd; }
      else if (s.type === 'rest') last = null;
      else {
        const snd = { t, dur: sd, type: s.type, tala: c.tala, matraDur: md, key: `${key}.${k}` };
        for (const f of ['swara', 'octave', 'vikrit', 'stroke', 'foot', 'accent', 'fermata', 'swell', 'slur', 'grace', 'hand', 'dev']) if (s[f] !== undefined) snd[f] = s[f];
        if (s.type === 'stroke' && tala && tala.roll) snd.rollPerMatra = tala.roll.strokesPerMatra;
        sounds.push(snd); last = snd;
      }
      t += sd;
    });
  };
  const playGans = (gs, c, pass) => gs.forEach(g => {
    if (g.yati) {
      const d = g.span * matraSec(c);
      beats.push({ t, dur: d, key: g.addr, yati: g.yati, span: g.span, charan: c.n, pass, tala: c.tala });
      last = null; t += d; return;
    }
    let mi = 0;
    g.gats.forEach((gt, ti) => gt.matras.forEach((m, j) => playMatra(m, c, `${g.addr}.${mi++}`, { ganStart: ti === 0 && j === 0, gatStart: j === 0, pass })));
  });

  const played = new Set();
  R.form.forEach((cid, fi) => {
    const c = ch[cid]; if (!c) return;
    const pk = pickupOf(part, cid);
    if (pk && !played.has(cid)) {
      const len = pk.matras.reduce((a, m) => a + (m.span || 1), 0) * matraSec(c);
      const save = t; t -= len; last = null;
      pk.matras.forEach(m => playMatra(m, c, `${cid}.p.${m.at}`, { ganStart: false, gatStart: false, pass: 0 }, fi === 0));
      t = save;
    }
    played.add(cid);
    for (let pass = 1; pass <= (c.repeat || 1); pass++) {
      playGans(segGans[`${cid}.b`] || [], c, pass);
      const ends = c.segments.filter(s => s !== 'b');
      if (ends.length) { const e = ends.includes(`e${pass}`) ? `e${pass}` : ends[ends.length - 1]; playGans(segGans[`${cid}.${e}`] || [], c, pass); }
    }
  });
  beats.sort((a, b) => a.t - b.t); sounds.sort((a, b) => a.t - b.t);
  return { beats, sounds, total: t, origin };
}

if (typeof module !== 'undefined') module.exports = { buildTimeline3 };

<script>
"use strict";
const $=s=>document.querySelector(s);
const PIECES=JSON.parse($('#pieces').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const INST={shankh:{dv:'शंख',en:'Shankh'},vanshi:{dv:'वंशी',en:'Vanshi'},anak:{dv:'आनक',en:'Anak'}};
const MEL=['shankh','vanshi'];

const SA=[['C4',261.63],['C#4',277.18],['D4',293.66],['D#4',311.13],['E4',329.63],['F4',349.23],['G3',196],['A3',220],['A#3',233.08],['B3',246.94]];

const EPS=1e-6;
const store={get(k,d){try{const v=localStorage.getItem('gb-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gb-'+k,JSON.stringify(v))}catch(e){}}};

let piece=null, leadKey=null, melKey=null, hasAnak=false;
let SEGS=[], COL={}, CELLS={}, STEPS={}, EV=null, TL={};
let saHz=261.63, tvx=store.get('tvx',false), focus='all';
const muted={mel:false,anak:false,panav:false,jhal:false,trib:false,step:true};

/* ---------------- v3 helpers ---------------- */
// Everything comes from the ghosh/3 file: talas, derived ताल वाद्य and कदम parts, book lines.
const ROW={shankh:'mel',vanshi:'mel',anak:'anak',panav:'panav',jhallari:'jhal',tribhuj:'trib',steps:'step'};
const TVPART={panav:'panav',jhal:'jhallari',trib:'tribhuj'};
let R=null, GAN={}, PICK={};
function talaOf(cid){const c=R.charans.find(x=>x.id===cid)||R.charans[0];const d=R.talas[c.tala];
  return {key:c.tala,name:d.name.dev,cycle:d.cycle,ganSize:d.ganSize,gats:d.gats,steps:d.steps,laya:c.laya,def:d}}
const flatMatras=g=>g&&g.gats?g.gats.flatMap(x=>x.matras):[];

/* ---------------- notation glyphs ---------------- */
function slotHTML(s){
  let cls='s',inner=esc(s.dev||'');
  if(s.type==='note'){if(s.octave<0)cls+=' dot-b';if(s.octave>0)cls+=' dot-t';if(s.vikrit)cls+=' vk'}
  if(s.slur==='start')cls+=' sls';else if(s.slur==='mid')cls+=' slm';else if(s.slur==='end')cls+=' sle';

  return `<span class="${cls}">${mk.length?`<span class="acc">${mk.join('')}</span>`:''}${pre}${inner}</span>`}
function matraInner(m){if(!m)return'';if(m.cue)return `<span class="cue">${esc(m.cue)}</span>`;
  return `<span class="sl8${m.group?' grp':''}">${m.slots.map(slotHTML).join('')}</span>${m.lyric?`<span class="ly">${esc(m.lyric)}</span>`:''}`}
const tvOf=m=>{const s=m&&m.slots&&m.slots.find(x=>x.type==='stroke');return s?{dev:s.dev,accent:!!s.accent}:null};

/* ---------------- render ---------------- */
function labelsHTML(mark=''){
  const L=(row,txt,cls,title)=>`<button class="lb ${cls}${muted[row]?' off':''}" data-row="${row}" title="${title}">${txt}</button>`;
  const mel=melKey?L('mel',INST[melKey].dv,'dv l-mel',`Mute ${INST[melKey].en}`):'<span></span>';
  const tvAll=muted.panav&&muted.jhal&&muted.trib;
  const tv=tvx?L('panav','पणव','dv l-tv','Mute पणव')
    :`<button class="lb dv l-tv${tvAll?' off':''}" data-row="tv" title="Mute ताल वाद्य">ताल</button>`;
  const chev=`<button class="chev" data-chev aria-label="${tvx?'Collapse to one row':'Show पणव, झल्लरी, त्रिभुज separately'}">${tvx?'▴':'▾'}</button>`;
  return `<div class="labels" data-mark="${esc(mark)}"><span class="lb mark">${esc(mark)}</span>${mel}${hasAnak?L('anak','आनक','dv l-anak','Mute आनक'):'<span></span>'}<div class="lb">${tv}${chev}</div>${L('jhal','झल्लरी','dv l-tv','Mute झल्लरी')}${L('trib','त्रिभुज','dv l-tv','Mute त्रिभुज')}${L('step','कदम','dv l-step',muted.step?'Hear steps':'Silence steps')}</div>`}

/* Table layout: every segment (run of lines in one tala) is ONE grid. Columns are
   [labels][start bar] then G × ([matras with gat separators][bar]); systems are subgrids, so a column
   is the same width in every row and सम, गट and bars line up like a table. */
function segLayout(tala,P,G){
  const n=tala.ganSize,gts=tala.gats&&tala.gats.length>1?tala.gats:[n],W=n+gts.length-1;
  const sepsBefore=pos=>{let a=0,k=0;for(let q=0;q<gts.length-1;q++){a+=gts[q];if(pos>=a)k++}return k};
  const col=(g,pos)=>P+3+g*(W+1)+pos+sepsBefore(pos), bar=g=>P+3+g*(W+1)+W;
  const ganT=gts.map(z=>`repeat(${z},minmax(var(--cw),auto))`).join(' var(--sepw) ');
  const tmpl=`var(--lw)${P?` repeat(${P},minmax(var(--cw),auto))`:''} var(--barw)`+` ${ganT} var(--barw)`.repeat(G)+' 10px';
  const seps=g=>{const out=[];let a=0;for(let q=0;q<gts.length-1;q++){a+=gts[q];out.push(P+3+g*(W+1)+a+q)}return out};
  const bounds=[];{let a=0;for(let q=0;q<gts.length-1;q++){a+=gts[q];bounds.push(a)}}
  return {n,W,col,bar,tmpl,seps,bounds}}
function cellsHTML(cols,colOf,o){
  let h='';
  cols.forEach((c,i)=>{const gc=colOf(i),at=r=>`data-c="${c.key}" style="grid-column:${gc};grid-row:${r}"`;
    const endHead=o.ending&&i===0&&o.endStart, pk=o.pickup?' pk':'';
    h+=`<div class="cell r-beat${pk}${c.beat===1?' sam':''}${o.ending?' endb':''}${endHead?' ends':''}" ${at(1)}>${endHead?`<span class="enl">${o.ending}</span>`:''}${c.beat||''}</div>`;
    if(!(o.yati&&o.leadRow==='mel'))h+=`<div class="cell r-mel${pk}" ${at(2)}>${c.mel||'<span class="empty">·</span>'}</div>`;
    if(!(o.yati&&o.leadRow==='anak'))h+=`<div class="cell r-anak${pk}" ${at(3)}>${c.anak||'<span class="empty">·</span>'}</div>`;
    ['panav','jhal','trib'].forEach((r,ri)=>{const t=c.tv&&c.tv[r];h+=`<div class="cell r-tv r-${r}${pk}" ${at(4+ri)}>${t?`<span class="tv${t.accent?' s':''}">${esc(t.dev)}</span>`:''}</div>`});
    if(c.step){const e=Math.min(cols.length-1,i+c.step.matras-1);
      h+=`<div class="cell r-step${pk}" data-c="${c.key}" data-s="${c.skey||c.key}" style="grid-column:${gc}/${colOf(e)+1};grid-row:7"><span class="foot ${c.step.foot}">${c.step.foot}</span></div>`}
  });
  if(o.yati){const row=o.leadRow==='mel'?2:3;
    h+=`<div class="cell ${row===2?'r-mel':'r-anak'} yati" data-c="${cols[0].key}" style="grid-column:${colOf(0)}/${colOf(cols.length-1)+1};grid-row:${row}">${o.yatiFirst?`दीर्घ यति · ${o.yati} गण`:''}</div>`}
  return h}
const barHTML=(c,kind,inl)=>`<i class="bar${kind==='॥'?' d':''}${kind===':॥'?' d rep':''}${inl?' inl':''}" style="grid-column:${c};grid-row:1/-1"${kind===':॥'?' title="repeat"':kind==='॥'?' title="end of चरण"':''}></i>`;
const swaraText=t=>String(t).replace(/(\S+?)'/g,'$1ँ').replace(/(\S+?)\./g,'$1़').replace(/_/g,'॒');
const DEVD=n=>String(n).replace(/\d/g,d=>'०१२३४५६७८९'[d]);
function segMaxG(seg){return Math.max(1,...seg.rows.map(r=>r.units.length))}
// Rows are the book's printed lines (layout.band.lines). A pickup line is drawn above the next line,
// right-aligned before ॥ over the end of that line, at the columns of its own matras.
function segmentHTML(seg,G){
  const L=segLayout(seg.tala,0,G),n=seg.tala.ganSize;let h=`<section class="ch">${seg.head?`<div class="seghead">${seg.head}</div>`:''}`;
  let firstRow=true;
  seg.rows.forEach(row=>{
    for(let i=0;i<row.units.length;i+=G){
      const units=row.units.slice(i,i+G), u0=units[0];
      const starts=u0.startsCharan?u0.charan:null;
      let mark='';
      if(starts){const c=R.charans.find(x=>x.id===starts);mark=seg.first&&firstRow?'॥ॐ॥':(c.label&&c.label!==String(c.n)?c.label:`चरण ${c.n}`)}
      const gap=starts&&!firstRow?' cstart':'';
      const pick=i===0?row.pick:null;
      if(pick&&pick.length){
        const ps=Math.max(0,units.filter(u=>!u.short).length-1);
        h+=`<div class="sys${gap}">${labelsHTML(mark)}`;
        h+=cellsHTML(pick,k=>{const b=pick[k].beat||n;return L.col(ps,(b-1)%n)},{pickup:true});
        h+=barHTML(L.bar(ps),'॥')+'</div><div class="sys">';mark=''}
      else h+=`<div class="sys${gap}">`;
      h+=`${labelsHTML(mark)}${barHTML(2,starts?'॥':'|')}`;
      units.forEach((u,g)=>{
        const maxPos=Math.max(...u.cols.map(x=>x.pos));L.seps(g).forEach((cc,q)=>{if(L.bounds[q]<=maxPos)h+=`<i class="sep" style="grid-column:${cc};grid-row:2/4"><b>,</b><b>,</b></i>`});
        h+=cellsHTML(u.cols,k=>L.col(g,u.cols[k].pos),u);
        const lastPos=u.cols[u.cols.length-1].pos;
        if(u.short&&lastPos<n-1)h+=barHTML(L.col(g,lastPos+1),u.bar,true);else h+=barHTML(L.bar(g),u.bar)});
      h+='</div>';firstRow=false}});
  return {html:h+'</section>',tmpl:L.tmpl}}

function render(){
  COL={};R=piece.rhythm;
  const lead=piece.layout.lead;
  melKey=MEL.includes(lead)?lead:(MEL.find(k=>piece.parts[k])||null); hasAnak=!!piece.parts.anak; leadKey=lead;
  const leadRow=melKey?'mel':'anak';
  GAN={};PICK={};
  Object.entries(piece.parts).forEach(([k,p])=>{GAN[k]=Object.fromEntries(p.gans.map(g=>[g.addr,g]));
    PICK[k]=Object.fromEntries((p.pickups||[]).map(pk=>[pk.charan,Object.fromEntries(pk.matras.map(m=>[m.at,m]))]))});
  const M=(k,addr,i)=>{const g=GAN[k]&&GAN[k][addr];return g?flatMatras(g)[i]:null};
  const fillCol=(col,get)=>{
    if(melKey)col.mel=matraInner(get(melKey));
    if(hasAnak){const m=get('anak');col.anak=m?matraInner(m):''}
    col.tv={};Object.entries(TVPART).forEach(([r,k])=>{col.tv[r]=tvOf(get(k))});
    const sm=get('steps');if(sm&&sm.step)col.step=sm.step;
    return col};

  // header
  const tk=[...new Set(R.charans.map(c=>`${R.talas[c.tala].name.dev}-${c.laya}`))];
  const T0=talaOf(R.charans[0].id);
  $('#ttl').textContent=piece.meta.title.dev;
  const raga=piece.meta.raga;
  $('#printhead').innerHTML=`<div class="bh"><span>${[melKey&&INST[melKey].dv,hasAnak&&'आनक','ताल वाद्य'].filter(Boolean).join(' · ')}</span><h2>${esc(piece.meta.title.dev)}</h2><span>${esc(T0.name)}-${DEVD(T0.laya)}</span></div>${(piece.meta.verse||[]).length?`<div class="verse">${piece.meta.verse.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`:''}${raga?`<p>राग ${esc(raga.name)}${raga.aroha?` · <b>आरोहण</b> ${esc(swaraText(raga.aroha))} · <b>अवरोहण</b> ${esc(swaraText(raga.avaroha||''))}`:''}</p>`:''}`;
  $('#tags').innerHTML=tk.map(x=>`<span class="tag">${esc(x)}</span>`).join('')+(raga?`<span class="tag raga">राग ${esc(raga.name)}</span>`:'');
  $('#fmel').textContent=melKey?INST[melKey].dv:'Melody';$('#fmel').hidden=!melKey;
  $('#voicew').hidden=!melKey;$('#focus [data-f="anak"]').hidden=!hasAnak;

  // rows from the book lines
  const rows=[];let pendingPick=null,prevBeat=0;
  piece.layout.band.lines.forEach(line=>{
    if(line.pickup){const cid=line.pickup,T=talaOf(cid);
      const ats=new Set();Object.values(PICK).forEach(p=>Object.keys(p[cid]||{}).forEach(a=>ats.add(+a)));
      pendingPick=[...ats].sort((a,b)=>a-b).map(at=>{const key=`${cid}.p.${at}`;const any=Object.values(PICK).map(p=>p[cid]&&p[cid][at]).find(Boolean);
        COL[key]={beat:any&&any.beat,tala:T};
        return fillCol({key,beat:any&&any.beat,tala:T,gat:0},k=>PICK[k]&&PICK[k][cid]&&PICK[k][cid][at])});
      return}
    const units=[];
    line.gans.forEach(addr=>{
      const g=GAN[lead][addr],cid=g.charan,c=R.charans.find(x=>x.id===cid),T=talaOf(cid);
      const segGans=piece.parts[lead].gans.filter(x=>x.charan===cid&&x.seg===g.seg);
      const isLast=segGans[segGans.length-1].addr===addr, idx=segGans.indexOf(g);
      const ends=c.segments.filter(s=>s!=='b');
      let bar='|';
      if(isLast){if(g.seg==='b')bar=ends.length?'|':(c.repeat>1?':॥':'॥');else bar=g.seg===ends[ends.length-1]?'॥':':॥'}
      const ending=g.seg==='b'?0:g.seg.slice(1), endStart=idx===0;
      const base={charan:cid,startsCharan:g.seg==='b'&&idx===0,bar,ending,endStart};
      if(g.yati){
        const n=T.ganSize, ref=GAN.panav[addr]||GAN.steps&&GAN.steps[addr];
        const ms=flatMatras(ref);
        const gts=T.gats||[n];const gatOf=j=>{let pos=j%n,a=0;for(let q=0;q<gts.length;q++){a+=gts[q];if(pos<a)return q}return 0};
        COL[addr]={yati:true,tala:T};
        const cols=ms.map((m,j)=>fillCol({key:addr,skey:`${addr}.${j}`,beat:m.beat,tala:T,gat:gatOf(j),pos:j%n},k=>k===lead?null:M(k,addr,j)));
        if(ms.length)prevBeat=ms[ms.length-1].beat;
        for(let s0=0;s0<cols.length;s0+=n)units.push({...base,cols:cols.slice(s0,s0+n),bar:s0+n>=cols.length?bar:'|',startsCharan:base.startsCharan&&s0===0,endStart:endStart&&s0===0,yati:g.yati,yatiFirst:s0===0,leadRow});
        return}
      const cols=[];let mi=0;
      g.gats.forEach((gt,ti)=>gt.matras.forEach(m=>{const i=mi++,key=`${addr}.${i}`;COL[key]={beat:m.beat,tala:T};if(m.beat)prevBeat=m.beat;
        cols.push(fillCol({key,beat:m.beat,tala:T,gat:ti,pos:i},k=>M(k,addr,i)))}));
      units.push({...base,cols,short:!!g.short});
    });
    if(!units.length)return;
    rows.push({units,pick:pendingPick,tala:units[0].cols[0].tala});pendingPick=null;
  });
  // segments: consecutive lines in the same tala share one table
  SEGS=[];rows.forEach(r=>{const k=r.tala.key;const last=SEGS[SEGS.length-1];
    if(last&&last.k===k)last.rows.push(r);else SEGS.push({k,tala:r.tala,rows:[r]})});
  SEGS.forEach((sg,i)=>{sg.first=i===0;sg.head=SEGS.length>1?`<span>${esc(sg.tala.name)}-${DEVD(sg.tala.laya)}</span>`:''});
  const sc=$('#score');
  sc.innerHTML=SEGS.map((_,i)=>`<div class="tseg" data-seg="${i}"></div>`).join('');
  sc.classList.toggle('no-mel',!melKey);sc.classList.toggle('no-anak',!hasAnak);sc.classList.toggle('tvx',tvx);
  layout();legend();
  $('#focus [data-f="step"]').hidden=$('#score').classList.contains('no-step');
}

function layout(){
  // Fill each segment with as many गण per row as the book prints, fewer if the screen is narrow.
  document.querySelectorAll('.tseg').forEach(el=>{const sg=SEGS[+el.dataset.seg];
    const mx=segMaxG(sg);
    for(let G=mx;G>=1;G--){const r=segmentHTML(sg,G);el.style.gridTemplateColumns=r.tmpl;el.innerHTML=r.html;
      if(el.scrollWidth<=el.clientWidth+1)break}});
  CELLS={};STEPS={};
  document.querySelectorAll('#score [data-c]').forEach(e=>{(CELLS[e.dataset.c]=CELLS[e.dataset.c]||[]).push(e);if(e.dataset.s)STEPS[e.dataset.s]=e});
  $('#score').classList.toggle('no-step',!Object.keys(STEPS).length);
  lastKey=null;lastStep=null;
}
function refreshLabels(){document.querySelectorAll('.labels').forEach(l=>l.outerHTML=labelsHTML(l.dataset.mark||''))}

// ताल व लय: a short Marathi primer for someone new, from the talas in the file
function secMR(laya){const v=60/laya,f={0.5:'अर्धा सेकंद',0.25:'पाव सेकंद',1:'एक सेकंद'};
  if(f[v])return f[v];for(const d of [3,6,8,4,5]){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return `${DEVD(n)}/${DEVD(d)} सेकंद`}return DEVD(+v.toFixed(2))+' सेकंद'}
function talaPrimer(){
  const standing=piece.meta.performance.mode==='standing';
  const seen=new Map();R.charans.forEach(c=>{const k=c.tala+'-'+c.laya;if(!seen.has(k))seen.set(k,talaOf(c.id))});
  return [...seen.values()].map(t=>{

function audio(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();

function click(t,vel,out){noise(t,.025,2600,9,.9*vel,out)}
function playStroke(e,t,out){const v=e.accent?1.45:1;

    case'thra':hit(t,1.2*v,out);hit(t+.008,.8*v,out);for(let k=1;k<5;k++)hit(t+k*.028,.32/k*v,out);break;

function panav(t,v,out){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(46,t+.16);

function jhal(t,v,out){noise(t,.6,6800,.6,.26*v,out,'highpass');noise(t,.22,3600,1.4,.16*v,out)}
function trib(t,v,out){[[2350,1],[6150,.45],[8550,.25]].forEach(([f,a])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;

function hz(s){const r=RATIO[s.swara][s.vikrit?(s.swara==='M'?1:0):(s.swara==='M'?0:1)];return saHz*r*Math.pow(2,s.octave||0)}
function breathNoise(t,d,f,gain,out,sus){const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;const b=ctx.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=1.5;const g=ctx.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(Math.max(sus||.0001,.0001),t+.12);if(sus)g.gain.setValueAtTime(sus,t+Math.max(.12,d-.05));g.gain.linearRampToValueAtTime(0,t+d);

/* ---------------- events + transport ---------------- */
function buildEvents(){
  const tempo=+$('#speed').value/100;TL={};
  Object.keys(piece.parts).forEach(k=>TL[k]=buildTimeline3(piece,k,{tempo}));
  const E={hl:[],st:[],items:[]};const lb=TL[leadKey].beats;const have=new Set(lb.map(b=>b.key));
  lb.forEach(b=>E.hl.push({t:b.t,key:b.key,b}));
  Object.entries(TL).forEach(([k,tl])=>{if(k===leadKey)return;tl.beats.forEach(b=>{if(b.pass===0&&!have.has(b.key)){have.add(b.key);E.hl.push({t:b.t,key:b.key,b})}})});
  if(TL.steps)TL.steps.beats.forEach(b=>{if(b.step)E.st.push({t:b.t,skey:b.key,foot:b.step})});
  ['hl','st'].forEach(k=>E[k].sort((a,b)=>a.t-b.t));
  Object.entries(TL).forEach(([k,tl])=>tl.sounds.forEach(s=>E.items.push({t:s.t,row:ROW[k],k,s})));
  if($('#clk').checked)E.hl.forEach(h=>E.items.push({t:h.t,tick:h.b&&h.b.sam?1.6:1}));
  E.items.sort((a,b)=>a.t-b.t);
  E.end=Math.max(...Object.values(TL).map(t=>t.total));
  EV=E}
const S={playing:false,t0:0,off:0,idx:0,winS:0,winE:Infinity,timer:null,raf:null,countT:[]};
function idxAt(arr,t){let lo=0,hi=arr.length-1,a=-1;while(lo<=hi){const m=(lo+hi)>>1;if(arr[m].t<=t+EPS){a=m;lo=m+1}else hi=m-1}return a}
function start(from=0){
  audio();buildEvents();S.off=from;S.winS=0;S.winE=Infinity;
  if($('#loop').checked){const h=EV.hl[Math.max(0,idxAt(EV.hl,from))];const c=h&&h.b?h.b.charan:null;
    const inC=EV.hl.filter(x=>x.b&&x.b.charan===c&&x.b.pass>0);
    if(inC.length){S.winS=inC[0].t;const l=inC[inC.length-1];S.winE=l.t+l.b.dur;if(from<S.winS||from>=S.winE)S.off=S.winS}}
  // count-in: two steps, played on the पणव (ध्वंकार-द्वय)
  let lead=.12;
  if($('#count').checked){const h=EV.hl[Math.max(0,idxAt(EV.hl,S.off))];const info=h&&COL[h.key];
    let md=h&&h.b?h.b.dur:.5;if(h&&h.b&&h.b.span)md/=h.b.span;
    const cd=Math.min(1.6,Math.max(.35,md*(R.countIn&&R.countIn.matras||2)));const now=ctx.currentTime+.12;
    [0,1].forEach(k=>{panav(now+k*cd,k?.8:1,gainFor('count'));S.countT.push(setTimeout(()=>{const el=$('#count');el.textContent=k?'दो':'एक';el.hidden=false},(.12+k*cd)*1000))});
    S.countT.push(setTimeout(()=>{$('#count').hidden=true},(.12+2*cd)*1000));lead=.12+2*cd}
  S.t0=ctx.currentTime+lead;S.idx=EV.items.findIndex(x=>x.t>=S.off-EPS);if(S.idx<0)S.idx=EV.items.length;
  S.playing=true;$('#pi').setAttribute('d','M7 5h4v14H7zM13 5h4v14h-4z');$('#play').setAttribute('aria-label','Stop');
  S.timer=setInterval(schedule,25);schedule();S.raf=requestAnimationFrame(frame)}
function stop(){S.playing=false;clearInterval(S.timer);cancelAnimationFrame(S.raf);S.countT.forEach(clearTimeout);S.countT=[];$('#count').hidden=true;

function schedule(){const hz2=ctx.currentTime+.25;
  for(;;){
    if(S.idx>=EV.items.length||EV.items[S.idx].t>=S.winE-EPS){
      if(S.winE!==Infinity){const next=S.t0+(S.winE-S.off);if(next-hz2>.2)return;S.t0=next;S.off=S.winS;S.idx=EV.items.findIndex(x=>x.t>=S.winS-EPS);continue}
      if(ctx.currentTime>S.t0+(EV.end-S.off)+.4){stop();$('#posc').textContent='Finished';$('#posd').textContent='Tap ▶ to play again'}

let lastKey=null,lastStep=null;
function frame(){if(!S.playing)return;const now=ctx.currentTime-S.t0+S.off;

function paint(h,st){

    const el=cs[0];if(el){const r=el.getBoundingClientRect(),top=$('.top').getBoundingClientRect().bottom;
      if(r.top<top+8||r.bottom>innerHeight-16)el.closest('.sys').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      const gs=el.closest('.tseg');if(gs){const gr=gs.getBoundingClientRect();if(r.right>gr.right||r.left<gr.left)gs.scrollLeft+=r.left-gr.left-30}}
    const b=h.b;if(b){const tala=COL[h.key]&&COL[h.key].tala;

      $('#posd').textContent=[tala?`${tala.name} · matra ${COL[h.key].beat||'–'} of ${tala.cycle}`:'',b.yati?`दीर्घ यति ${b.yati} गण`:'',b.cue||''].filter(Boolean).join(' · ')}}

  $('#voice').innerHTML=VOICE_ORDER.map(v=>`<option value="${v}" ${melKey&&voiceFor[melKey]===v?'selected':''}>${VOICES[v].en} · ${VOICES[v].dv}</option>`).join('');
  $('#posc').textContent='Ready';$('#posd').textContent='Tap ▶, or tap any matra to start there';store.set('piece',piece.id)}
$('#piece').innerHTML=PIECES.map(p=>{const parts=Object.keys(p.parts).filter(k=>INST[k]).map(k=>INST[k].dv).join(' + ');const t=p.rhythm.talas[p.rhythm.tala].name.dev;return `<option value="${p.id}">${esc(p.meta.title.dev)} · ${esc(t)} · ${parts}</option>`}).join('');
$('#piece').onchange=e=>loadPiece(e.target.value);
$('#sa').innerHTML=SA.map(([n,f])=>`<option value="${f}">${n}</option>`).join('');$('#sa').onchange=e=>{saHz=+e.target.value};
$('#play').onclick=()=>{if(S.playing)stop();else start(0)};
$('#speed').oninput=()=>{$('#spv').textContent=$('#speed').value+'%';restartAt()};
['#loop','#clk'].forEach(s=>$(s).onchange=()=>restartAt());
$('#voice').onchange=e=>{if(!melKey)return;voiceFor[melKey]=e.target.value;store.set('voices',voiceFor);
  if(!S.playing){audio();const out=gainFor('mel'),t=ctx.currentTime+.05;[['S',0],['G',0],['P',0]].forEach(([s,o],k)=>playNote({swara:s,octave:o,dur:.32},t+k*.34,out,melKey))}};
$('#focus').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;focus=b.dataset.f;
  $('#focus').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#score').dataset.focus=focus;layout();if(S.playing)lastKey=null});
$('#score').addEventListener('click',e=>{
  if(e.target.closest('[data-chev]')){tvx=!tvx;store.set('tvx',tvx);$('#score').classList.toggle('tvx',tvx);refreshLabels();return}
  const lb=e.target.closest('.lb[data-row]');
  if(lb){const r=lb.dataset.row;if(r==='tv'){const v=!(muted.panav&&muted.jhal&&muted.trib);['panav','jhal','trib'].forEach(k=>setMute(k,v))}else setMute(r,!muted[r]);
    refreshLabels();return}
  const c=e.target.closest('[data-c]');if(!c||!EV)return;
  const h=EV.hl.find(x=>x.key===c.dataset.c);if(!h)return;if(S.playing)stop();start(h.t)});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['SELECT','INPUT','BUTTON','SUMMARY'].includes(e.target.tagName)){e.preventDefault();$('#play').click()}});
document.addEventListener('click',e=>{const d=$('#set');if(d.open&&!d.contains(e.target))d.open=false});
let rw=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-rw)<4)return;rw=innerWidth;clearTimeout(window._rt);window._rt=setTimeout(()=>{layout();lastKey=null},150)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(piece)layout()});
const init=store.get('piece','bharatam');$('#piece').value=PIECES.some(p=>p.id===init)?init:PIECES[0].id;loadPiece($('#piece').value);
</script>
