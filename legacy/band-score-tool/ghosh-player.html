<title>Ghosh Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: sticky transport on top (piece, parts, tala strip), notation below rendered from the JSON tree; the playing matra is highlighted */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --raise:#faf8f4; --fg:#1d1f2b; --muted:#676b7b; --line:#e3e0d8;
  --accent:#b8560f; --accent-soft:#f6e5d6; --ink:#27306b; --ink-soft:#e4e6f4; --leaf:#2f6b4f; --leaf-soft:#dcefe5; --chip:#ecebe6;
  --now:#ffe2b8; --now-fg:#7a3a00;
  --display:"Tiro Devanagari Hindi","Noto Serif Devanagari",Georgia,serif;
  --body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14151c; --surface:#1d1f29; --raise:#232532; --fg:#ebe9e4; --muted:#9a9cab; --line:#2f3142;
  --accent:#f0954a; --accent-soft:#3a2716; --ink:#aab4ff; --ink-soft:#272b45; --leaf:#7fcca4; --leaf-soft:#1c3328; --chip:#262836;
  --now:#5a3a12; --now-fg:#ffd7a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14151c; --surface:#1d1f29; --raise:#232532; --fg:#ebe9e4; --muted:#9a9cab; --line:#2f3142;
  --accent:#f0954a; --accent-soft:#3a2716; --ink:#aab4ff; --ink-soft:#272b45; --leaf:#7fcca4; --leaf-soft:#1c3328; --chip:#262836;
  --now:#5a3a12; --now-fg:#ffd7a6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;gap:10px;padding-block:10px}
.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--ink);line-height:1.1}
h1 small{font-family:var(--body);font-size:.8rem;color:var(--muted);margin-left:6px}
select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.tag{font-size:.78rem;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.raga{background:var(--leaf-soft);color:var(--leaf)}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:22px;height:22px;fill:currentColor}
.pchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:.9rem}
.pchip .dv{font-family:var(--display);font-size:1rem}
.pchip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.pchip.view{box-shadow:inset 0 0 0 1.5px currentColor}
.pchip.i-shankh{color:var(--ink)} .pchip.i-vanshi{color:var(--leaf)} .pchip.i-anak{color:var(--accent)}
.tog{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--accent);width:18px;height:18px}
.sl{display:flex;align-items:center;gap:8px;flex:1;min-width:170px}
.sl input{flex:1;min-width:0;accent-color:var(--accent)}
@media (max-width:560px){.sl{flex-basis:100%}}
.sl span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip{display:flex;gap:4px;align-items:center;overflow:hidden;flex-wrap:wrap}
.strip .g{display:flex;gap:3px;padding:3px 5px;border-radius:8px;background:var(--raise);border:1px solid var(--line)}
.strip .b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.68rem;color:var(--muted);background:var(--chip);font-variant-numeric:tabular-nums}
.strip .b.sam{box-shadow:inset 0 0 0 2px var(--accent)}
.strip .b.on{background:var(--accent);color:#fff}
.feet{display:flex;gap:4px;margin-left:6px}
.feet span{font-weight:700;font-size:.85rem;padding:1px 8px;border-radius:6px;color:var(--muted);background:var(--chip)}
.feet span.on{background:var(--leaf);color:#fff}
.status{font-size:.82rem;color:var(--muted);min-height:1.2em}
main .wrap{padding-block:16px 60px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.ch{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;display:grid;gap:8px}
.ch h3{margin:0;font-size:.9rem;font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ch h3 b{font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--fg)}
.ch h3 .rep{color:var(--accent)}
.ch .note{font-size:.82rem;color:var(--muted);margin:0}
.lines{display:grid;gap:6px;overflow-x:auto;padding-bottom:4px}
.ln{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:6px}
.gan+.bar{margin-right:2px}
.ganw{display:flex;align-items:stretch}
.bar{width:12px;display:grid;place-items:center;color:var(--muted);font-size:1.1rem}
.gan{display:flex;align-items:stretch;padding:0 2px}
.gat{display:flex}
.gat+.gat::before{content:",";color:var(--muted);align-self:center;margin:0 3px}
.m{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;padding:10px 6px 12px;border-radius:8px;cursor:pointer;transition:background .08s}
.m:hover{background:var(--raise)}
.m .sl8{display:flex;gap:1px;font-family:var(--display);font-size:1.25rem;line-height:1.1;position:relative}
.m.grp .sl8::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-5px;height:5px;border:1.5px solid var(--fg);border-top:0;opacity:.7}
.m .lyr{font-size:.72rem;color:var(--leaf);margin-top:6px}
.m .bt{position:absolute;top:1px;left:4px;font-size:.6rem;color:var(--muted);opacity:.7}
.m.sam .bt{color:var(--accent);opacity:1;font-weight:700}
.m.now{background:var(--now)}
.m.now .sl8{color:var(--now-fg)}
.m.cue{min-width:120px;font-style:italic;color:var(--muted)}
.s{position:relative;padding:0 1px}
.s.now{color:var(--accent)}
.s.dot-b::after,.s.dot-t::before{content:"";position:absolute;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.s.dot-b::after{bottom:-3px}
.s.dot-t::before{top:-3px}
.s.vk{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.s .acc{position:absolute;top:-9px;left:0;right:0;text-align:center;font-size:.7rem;font-family:var(--body)}
.s .gr{font-size:.65em;vertical-align:super;opacity:.8}
.s.sls,.s.slm,.s.sle{border-top:1.5px solid var(--muted)}
.s.sls{border-top-left-radius:10px}
.s.sle{border-top-right-radius:10px}
.end{display:flex;align-items:stretch;border-top:1.5px solid var(--fg);border-left:1.5px solid var(--fg);border-radius:3px 0 0 0;margin-left:4px;position:relative;padding-top:2px}
.end>.lab{position:absolute;top:-1px;left:3px;font-size:.65rem;color:var(--muted)}
.yati{display:flex;align-items:center;gap:6px;padding:0 14px;color:var(--muted);font-size:.85rem}
.yati.now{background:var(--now);border-radius:8px}
.pick{opacity:.85}
.legend{font-size:.8rem;color:var(--muted)}
.media{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.media a{color:var(--accent);font-weight:500;text-decoration:none}
.media a:hover{text-decoration:underline}
@media (max-width:560px){.m{min-width:40px;padding:10px 4px 12px}.m .sl8{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){.m{transition:none}}
</style>

<header class="top"><div class="wrap">
  <div class="r">
    <h1 id="ttl"></h1>
    <span id="tags" class="r" style="gap:6px"></span>
    <span style="flex:1"></span>
    <select id="piece" aria-label="Piece"></select>
  </div>
  <div class="r">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="pi" d="M8 5v14l11-7z"/></svg></button>
    <div id="parts" class="r" style="gap:6px"></div>
    <div class="sl"><span>Speed</span><input type="range" id="speed" min="40" max="120" step="5" value="100" aria-label="Speed"><span id="spv"></span></div>
  </div>
  <div class="r" style="gap:14px">
    <label class="tog"><input type="checkbox" id="clk" checked> Tala click</label>
    <label class="tog"><input type="checkbox" id="loop"> Loop this charan</label>
    <label class="tog">Sa <select id="sa"></select></label>
    <label class="tog" id="viewwrap">Show <select id="viewsel"></select></label>
    <span class="status" id="st">Tap ▶, or tap any matra to start there.</span>
  </div>
  <div class="r" id="voices" style="gap:12px"></div>
  <div class="r"><div class="strip" id="strip"></div><div class="feet" id="feet" hidden><span data-f="L">L</span><span data-f="R">R</span></div></div>
</div></header>
<main><div class="wrap" id="sheet"></div></main>

<script>/*
 * timeline.js — ghosh-notation/2 part -> timed list for an audio engine.
 *
 *   const tl = buildTimeline(piece.parts.anak, { tempo: 1 });
 *   tl.beats  : one entry per matra played  { t, dur, beat, sam, ganStart, gatStart, step, path }
 *   tl.sounds : one entry per sounding slot  { t, dur, type, swara, octave, vikrit, stroke, accent, slur, grace, tala, path }
 *   tl.total  : seconds
 *
 * Holds (ऽ) lengthen the previous sound; rests end it. Repeats, endings, pickups,
 * per-charan laya/tala and part.form are resolved here, so the player only schedules.
 */
'use strict';

function buildTimeline(part, opts = {}) {
  const tempo = opts.tempo || 1;
  const beats = [], sounds = [];
  let t = 0, last = null;
  const byLabel = Object.fromEntries(part.charans.filter(c => c.label).map(c => [String(c.label), c]));
  const order = part.form ? part.form.map(x => byLabel[String(x)] || part.charans[+x - 1]).filter(Boolean) : part.charans;
  const pickedUp = new Set();
  let leadStart = 0;

  const playMatra = (m, ctx, path) => {
    const tala = ctx.tala;
    const span = m.span || 1;
    const mdur = (60 / ctx.laya) / tempo;
    const dur = span * mdur;
    const b = m.beat || 1;

  t0=ctx.currentTime+.12; schedIdx=items.findIndex(x=>x.t>=offset-1e-6); if(schedIdx<0)schedIdx=items.length;
  st.playing=true;$('#pi').setAttribute('d','M7 5h4v14H7zM13 5h4v14h-4z');
  timer=setInterval(schedule,25);schedule();raf=requestAnimationFrame(frame);
}
function stop(){st.playing=false;clearInterval(timer);cancelAnimationFrame(raf);
  const old=partGain;partGain={};
  Object.values(old).forEach(g=>{g.gain.cancelScheduledValues(ctx.currentTime);g.gain.setTargetAtTime(0,ctx.currentTime,.02)});
  setTimeout(()=>Object.values(old).forEach(g=>g.disconnect()),200);
  $('#pi').setAttribute('d','M8 5v14l11-7z');highlight(null)}
function schedule(){
  const horizon=ctx.currentTime+.25;
  for(;;){
    if(schedIdx>=items.length||items[schedIdx].t>=winEnd-1e-6){
      if(winEnd!==Infinity){ // loop: re-anchor
        const nextAnchor=t0+(winEnd-offset); if(nextAnchor-horizon>.2)return;
        t0=nextAnchor;offset=winStart;schedIdx=items.findIndex(x=>x.t>=winStart-1e-6);continue}
      if(ctx.currentTime>t0+(endTime()-offset)+.3){stop();$('#st').textContent='Finished. Tap ▶ to play again.'}
      return}
    const it=items[schedIdx];const at=t0+(it.t-offset);
    if(at>horizon)return;
    if(it.tick)tick(at,it.tick);
    else if(!muted[it.k]){const out=gainFor(it.k);
      if(it.s.type==='stroke')playStroke(it.s,at,out);else if(it.s.type==='note')playNote(it.s,at,out,it.k)}
    schedIdx++;
  }
}
function endTime(){return Math.max(...Object.values(TL).map(t=>t.total))}
function idxAt(t){let lo=0,hi=beatsView.length-1,a=0;while(lo<=hi){const m=(lo+hi)>>1;if(beatsView[m].t<=t+1e-6){a=m;lo=m+1}else hi=m-1}return a}
function frame(){
  if(!st.playing)return;
  const now=ctx.currentTime-t0+offset;
  if(now>=0){const b=beatsView[idxAt(now)];if(b){highlight(b);}}
  raf=requestAnimationFrame(frame)}
function highlight(b){
  if(!b){document.querySelectorAll('.now').forEach(e=>e.classList.remove('now'));lastPath=null;$('#strip').querySelectorAll('.on').forEach(e=>e.classList.remove('on'));$('#feet').querySelectorAll('.on').forEach(e=>e.classList.remove('on'));return}
  if(b.path===lastPath)return;lastPath=b.path;
  document.querySelectorAll('.now').forEach(e=>e.classList.remove('now'));
  const el=document.querySelector(`[data-path="${b.path}"]`);
  if(el){el.classList.add('now');const r=el.getBoundingClientRect();const top=$('.top').getBoundingClientRect().bottom;
    if(r.top<top+10||r.bottom>innerHeight-20)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    const ln=el.closest('.lines');if(ln){const lr=ln.getBoundingClientRect();if(r.left<lr.left||r.right>lr.right)ln.scrollLeft+=r.left-lr.left-40}}
  if(b.tala)drawStrip(b.tala);
  $('#strip').querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  if(b.beat){const s=$('#strip').querySelector(`[data-b="${b.beat}"]`);if(s)s.classList.add('on')}
  $('#feet').querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  if(b.step){const f=$('#feet').querySelector(`[data-f="${b.step}"]`);if(f)f.classList.add('on')}
  $('#st').textContent=`चरण ${b.charan}${b.pass>1?` · repeat`:b.pass===0?' · pickup':''}${b.cue?` · ${b.cue}`:''}${b.yati?` · rest ${b.yati} गण`:''}`;
}

/* ---------------- wiring ---------------- */
function loadPiece(id){if(st.playing)stop();stripKey=null;piece=PIECES.find(p=>p.id===id);muted={};
  view=ORDER.find(k=>piece.parts[k]&&k!=='anak')||ORDER.find(k=>piece.parts[k]);renderParts();render();build();if($('#spv'))spv();
  try{localStorage.setItem('gp-piece',id)}catch(e){}}
$('#piece').innerHTML=PIECES.map(p=>`<option value="${p.id}">${esc(p.title.dev)} · ${Object.keys(p.parts).map(k=>INST[k]?INST[k].dv:k).join(' + ')}</option>`).join('');
$('#piece').onchange=e=>loadPiece(e.target.value);
$('#sa').innerHTML=SA.map(([n,f])=>`<option value="${f}">${n}</option>`).join('');$('#sa').onchange=e=>{saHz=+e.target.value};
$('#play').onclick=()=>{if(st.playing)stop();else start(0)};
const spv=()=>{$('#spv').textContent=`${$('#speed').value}% of printed laya`};
$('#speed').oninput=()=>{spv();if(st.playing){const i=idxAt(ctx.currentTime-t0+offset);stop();build();const t=beatsView[i]?beatsView[i].t:0;start(t)}else build()};
$('#loop').onchange=()=>{if(st.playing){const now=ctx.currentTime-t0+offset;stop();setTimeout(()=>start(now),130)}};
$('#parts').addEventListener('click',e=>{const b=e.target.closest('.pchip');if(!b)return;const k=b.dataset.k;
  muted[k]=!muted[k];if(ctx&&partGain[k])partGain[k].gain.setTargetAtTime(muted[k]?0:1,ctx.currentTime,.02);renderParts()});
$('#voices').addEventListener('change',e=>{const k=e.target.dataset.voice;if(!k)return;voiceFor[k]=e.target.value;try{localStorage.setItem('gp-voices',JSON.stringify(voiceFor))}catch(_){} if(!st.playing)preview(k)});
$('#viewsel').onchange=e=>{const was=st.playing,i=was?idxAt(ctx.currentTime-t0+offset):0;if(was)stop();view=e.target.value;render();spv();build();if(was)start(beatsView[i]?beatsView[i].t:0)};
$('#sheet').addEventListener('click',e=>{const m=e.target.closest('[data-path]');if(!m)return;
  const bb=beatsView.find(x=>x.path===m.dataset.path);if(!bb)return;if(st.playing)stop();start(bb.t)});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='SELECT'&&e.target.tagName!=='INPUT'){e.preventDefault();$('#play').click()}});
let initial=PIECES[0].id;try{const v=localStorage.getItem('gp-piece');if(v&&PIECES.some(p=>p.id===v))initial=v}catch(e){}
$('#piece').value=initial;loadPiece(initial);spv();build();
</script>
